apiVersion: v1
market:
  symbol: "NASDAQ100"
  tick_size: 0.01
  point_value: 1.0
  multiplier: 1.0
  timezone: "UTC"
  exchange_timezone: "America/New_York"
  session_hours_utc: null
  value_area_percent: 0.70
  profile_method: "swing"
  allow_ohlcv_proxy: false
  require_real_footprint_for_exact_models: true
  effort_box_source: "external"

risk:
  account_equity: null  # OPERATOR_REQUIRED
  risk_per_trade: null  # OPERATOR_REQUIRED
  daily_loss_limit: null  # OPERATOR_REQUIRED for live mode; paper mode may be disabled here
  max_drawdown: null  # OPERATOR_REQUIRED
  max_concurrent_positions: 1
  aggregate_risk_limit: null
  max_adds: 0
  max_order_qty: null
  min_order_qty: 1.0
  lot_step: 1.0
  max_loss_streak: null
  stop_buffer_ticks: 1.0
  stop_rounding: "tick"
  allow_pyramiding: false  # SOURCE_EXPLICIT: no pyramiding by default
  allow_averaging_down: false
  default_live_mode: false

strategies:
  directional_drift:
    enabled: true  # SOURCE_EXPLICIT: primary drift model is enabled by default when data quality is sufficient
    min_confirmation_bars: 1
    use_real_effort_boxes: false
    require_value_context: true
    require_delta_confirmation: true
    allow_1r_target: true
    allow_1_2_target: false
    target_rr: 1.0
    max_trailing_boxes: 5
    min_absorption_strength: 1.5  # ENGINEERING_ASSUMPTION
    delta_threshold: 0.0  # ENGINEERING_ASSUMPTION
    use_ohlcv_proxy: false  # EXPERIMENTAL_PROXY; off by default
    exit_policy: "trail_stop"  # SOURCE_EXPLICIT for primary model
    use_partial_exits: false  # SOURCE_EXPLICIT: no partial profits by default

  machine_gun_scalp:
    enabled: true
    min_confirmation_bars: 1
    use_real_effort_boxes: false
    require_value_context: true
    require_delta_confirmation: true
    allow_1r_target: true
    allow_1_2_target: false  # ENGINEERING_ASSUMPTION: 1:2 optional only when explicitly enabled
    target_rr: 1.0  # SOURCE_EXPLICIT
    max_trailing_boxes: 0
    min_absorption_strength: 1.0
    delta_threshold: 0.0
    use_ohlcv_proxy: false
    exit_policy: "fixed_1r_target"
    use_partial_exits: false

  mean_reversion:
    enabled: false  # OPERATOR_REQUIRED: exit policy must be configured before use
    min_confirmation_bars: 1
    use_real_effort_boxes: false
    require_value_context: true
    require_delta_confirmation: false
    allow_1r_target: false
    allow_1_2_target: false
    target_rr: 1.0
    max_trailing_boxes: 0
    min_absorption_strength: 1.5
    delta_threshold: 0.0
    use_ohlcv_proxy: false
    exit_policy: "config_required"  # OPERATOR_REQUIRED for mean_reversion
    use_partial_exits: false

  momentum:
    enabled: false  # OPERATOR_REQUIRED: minimum trigger rules and exit policy must be configured
    min_confirmation_bars: 1
    use_real_effort_boxes: false
    require_value_context: true
    require_delta_confirmation: true
    allow_1r_target: false
    allow_1_2_target: false
    target_rr: 1.0
    max_trailing_boxes: 0
    min_absorption_strength: 1.0
    delta_threshold: 0.0
    use_ohlcv_proxy: false
    exit_policy: "config_required"  # OPERATOR_REQUIRED
    use_partial_exits: false
